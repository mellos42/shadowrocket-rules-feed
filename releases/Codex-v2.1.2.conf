IP-CIDR,100.64.0.0/10,DIRECT,no-resolve #共享地址网段
IP-CIDR,::1/128,DIRECT,no-resolve #IPv6 回环
IP-CIDR,fc00::/7,DIRECT,no-resolve #IPv6 局域网
IP-CIDR,fe80::/10,DIRECT,no-resolve #IPv6 本地链路

